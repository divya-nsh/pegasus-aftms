<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AFTMS Server Setup</title>

    <style>
      * {
        box-sizing: border-box;
      }

      :root {
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #18181b;
        background: #f4f4f5;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        background: #f4f4f5;
      }

      .card {
        width: 100%;
        max-width: 560px;
        padding: 28px;
        background: #fff;
        border: 1px solid #e4e4e7;
        border-radius: 12px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
      }

      .header {
        margin-bottom: 20px;
      }

      .header h1 {
        margin: 0 0 5px;
        font-size: 21px;
        line-height: 1.3;
        font-weight: 650;
        letter-spacing: -0.01em;
      }

      .header p {
        margin: 0;
        color: #71717a;
        font-size: 13px;
        line-height: 1.5;
      }

      .guide {
        margin-bottom: 20px;
        padding: 11px 13px;
        border: 1px solid #dbeafe;
        border-radius: 8px;
        background: #eff6ff;
        color: #1e40af;
        font-size: 12.5px;
        line-height: 1.45;
      }

      .guide strong {
        display: block;
        margin-bottom: 2px;
        font-weight: 600;
      }

      .section-title {
        margin-bottom: 12px;
        font-size: 13px;
        font-weight: 600;
      }

      .field {
        margin-bottom: 12px;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      label {
        display: block;
        margin-bottom: 5px;
        font-size: 12px;
        font-weight: 500;
        color: #3f3f46;
      }

      input {
        width: 100%;
        height: 38px;
        padding: 0 10px;
        border: 1px solid #d4d4d8;
        border-radius: 7px;
        outline: none;
        background: #fff;
        color: #18181b;
        font: inherit;
        font-size: 13px;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }

      input::placeholder {
        color: #a1a1aa;
      }

      input:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
      }

      input:disabled {
        background: #f4f4f5;
        color: #71717a;
        cursor: not-allowed;
        opacity: 1;
      }

      button {
        width: 100%;
        height: 40px;
        margin-top: 4px;
        border: 0;
        border-radius: 7px;
        background: #18181b;
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
      }

      button:hover:not(:disabled) {
        background: #27272a;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .message {
        display: none;
        margin-bottom: 12px;
        padding: 9px 11px;
        border-radius: 7px;
        font-size: 12.5px;
        line-height: 1.4;
      }

      .message.error {
        display: block;
        color: #b91c1c;
        background: #fef2f2;
        border: 1px solid #fecaca;
      }

      .message.success {
        display: block;
        color: #166534;
        background: #f0fdf4;
        border: 1px solid #bbf7d0;
      }

      @media (max-width: 520px) {
        .card {
          padding: 22px;
        }

        .row {
          grid-template-columns: 1fr;
          gap: 0;
        }
      }
    </style>
  </head>

  <body>
    <main class="card">
      <header class="header">
        <h1>AFTMS Server Setup</h1>
        <p>Configure the server before starting the application.</p>
      </header>

      <div class="guide">
        <strong>Before you continue</strong>
        PostgreSQL must be installed and running. Make sure you have your
        database connection details ready.
      </div>

      <div id="message" class="message"></div>

      <form id="setup-form">
        <div class="section-title">Server Setup</div>

        <div class="field">
          <label for="appDataDir">App Data Directory</label>
          <input
            id="appDataDir"
            name="appDataDir"
            type="text"
            value="{{APP_DATA_DIR}}"
            disabled
          />
        </div>

        <div class="section-title">Database Setup</div>

        <div class="field">
          <label for="host">Host</label>
          <input
            id="host"
            name="host"
            type="text"
            value="localhost"
            autocomplete="off"
            required
          />
        </div>

        <div class="row">
          <div class="field">
            <label for="port">Port</label>
            <input
              id="port"
              name="port"
              type="number"
              value="5432"
              min="1"
              max="65535"
              required
            />
          </div>

          <div class="field">
            <label for="database">Database</label>
            <input
              id="database"
              name="database"
              type="text"
              placeholder="aftms"
              autocomplete="off"
              required
            />
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="username">Username</label>
            <input
              id="username"
              name="username"
              type="text"
              placeholder="postgres"
              autocomplete="username"
              required
            />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="PostgreSQL password"
              autocomplete="current-password"
              required
            />
          </div>
        </div>

        <button id="submit-button" type="submit">Save &amp; Continue</button>
      </form>
    </main>

    <script>
      const form = document.getElementById("setup-form");
      const button = document.getElementById("submit-button");
      const message = document.getElementById("message");

      function clearMessage() {
        message.textContent = "";
        message.className = "message";
      }

      function showError(error) {
        message.textContent = error;
        message.className = "message error";
      }

      function showSuccess(text) {
        message.textContent = text;
        message.className = "message success";
      }

      async function parseResponse(response) {
        try {
          return await response.json();
        } catch {
          throw new Error(
            `Server returned an invalid response (${response.status}).`,
          );
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        button.disabled = true;
        button.textContent = "Saving...";
        clearMessage();

        const formData = new FormData(form);

        const data = {
          host: formData.get("host"),
          port: Number(formData.get("port")),
          database: formData.get("database"),
          username: formData.get("username"),
          password: formData.get("password"),
        };

        try {
          // Step 1: Save database configuration
          const configResponse = await fetch("/api/intializeConfig", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(data),
          });

          const configResult = await parseResponse(configResponse);

          if (!configResponse.ok) {
            throw new Error(
              configResult?.message ||
                configResult?.error ||
                `Failed to save configuration (${configResponse.status}).`,
            );
          }

          // Step 2: Restart service
          button.textContent = "Restarting service...";

          const restartResponse = await fetch("/api/restart-service", {
            method: "POST",
          });

          const restartResult = await parseResponse(restartResponse);

          if (!restartResponse.ok) {
            throw new Error(
              restartResult?.message ||
                restartResult?.error ||
                `Failed to restart service (${restartResponse.status}).`,
            );
          }

          window.location.reload();

          // Step 3: Complete
          showSuccess(
            restartResult?.message ||
              "Configuration saved and service restarted successfully.",
          );

          button.textContent = "Setup Complete";
        } catch (error) {
          if (error instanceof TypeError) {
            showError(
              "Could not connect to the setup server. Please make sure the server is running.",
            );
          } else {
            showError(
              error instanceof Error
                ? error.message
                : "Something went wrong. Please try again.",
            );
          }

          button.disabled = false;
          button.textContent = "Save & Continue";
        }
      });
    </script>
  </body>
</html>
